name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: the one-hour decoder fuzz run (job `fuzz-nightly`)
  workflow_dispatch:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      # Includes the golden-vector conformance tests and a short (4 s) fuzz smoke run.
      - name: Test (net8.0)
        run: dotnet test -c Release --no-build -f net8.0
      - name: Test (net10.0)
        run: dotnet test -c Release --no-build -f net10.0

  fuzz-nightly:
    # One hour of decoder mutation fuzzing; only on the nightly schedule or when started by hand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - name: Fuzz the decoder for one hour
        env:
          CCF_FUZZ_SECONDS: "3600"
        run: dotnet test -c Release --no-build -f net10.0 --filter "Category=Fuzz" --logger "console;verbosity=detailed"

  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run build
      # Blocking: everything except the golden-vector conformance tests (CCF_TESTS=blocking is the default).
      - run: npm test

  js-conformance:
    # Non-blocking until phase 3 makes the vectors pass; then remove continue-on-error.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run test:conformance
