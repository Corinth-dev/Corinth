name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: the one-hour decoder fuzz run (job `fuzz-nightly`)
  workflow_dispatch:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      # Includes the golden-vector conformance tests and a short (4 s) fuzz smoke run.
      - name: Test (net8.0)
        run: dotnet test -c Release --no-build -f net8.0
      - name: Test (net10.0)
        run: dotnet test -c Release --no-build -f net10.0

  fuzz-nightly:
    # One hour of decoder mutation fuzzing; only on the nightly schedule or when started by hand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - name: Fuzz the decoder for one hour
        env:
          CCF_FUZZ_SECONDS: "3600"
        run: dotnet test -c Release --no-build -f net10.0 --filter "Category=Fuzz" --logger "console;verbosity=detailed"

  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run build
      # Typecheck, unit tests, golden-vector conformance, client tests, a short fuzz run, package checks, typegen snapshots.
      - run: npm test

  js-browser:
    # The decoder, client, IndexedDB cache and the pure-JS SHA-256 fallback in a real Chromium.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      # Installs the browser build that matches the pinned playwright-core version.
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: npm run test:browser

  js-e2e:
    # The TypeScript client against the real .NET sample API. Required on pull requests (see the `required` job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: dotnet build -c Release samples/Ccf.SampleApi -f net10.0
        working-directory: dotnet
      - run: npm ci
        working-directory: js
      - run: npm run build
        working-directory: js
      - run: npm run test:e2e
        working-directory: js

  required:
    # One stable check name for branch protection: mark "required" as a required status check
    # (Settings > Branches). It fails unless every job below succeeded, so the end-to-end job
    # cannot be skipped or ignored on a pull request.
    if: always()
    needs: [dotnet, js, js-browser, js-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

  fuzz-nightly-js:
    # Thirty minutes of TypeScript decoder mutation fuzzing; only on the nightly schedule or when started by hand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: js/packages/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
        working-directory: js
      - name: Fuzz the TypeScript decoder
        env:
          CCF_FUZZ_SECONDS: "1800"
        run: npx vitest run test/fuzz.test.ts
